services:
  - type: web
    name: civicsurplus-website
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_DEMO_REQUEST_ENDPOINT
        value: https://formsubmit.co/ajax/info@auctrail.com
      - key: NEXT_PUBLIC_CONTACT_REQUEST_ENDPOINT
        value: https://formsubmit.co/ajax/info@auctrail.com
