name: Refresh Cases Screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-cases-screenshot.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download fresh Demo capture
        run: |
          curl --fail --location --silent --show-error 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-cd50-81fd-a1a0-d6cdcf139ba2/raw?se=2026-09-17T22%3A54%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=d2d49b27-d0d7-5607-8cbc-025c63b2940d&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A16%3A18Z&ske=2026-09-18T18%3A16%3A18Z&sks=b&skv=2026-02-06&sig=n1QTKv19JHZf5iRCwlI0bmkKH601hPXsCX34%2BrLbloU%3D' -o /tmp/demo-shots.zip
          rm -rf /tmp/demo-shots
          mkdir -p /tmp/demo-shots
          unzip -q /tmp/demo-shots.zip -d /tmp/demo-shots
          test -s /tmp/demo-shots/02-cases.png
          file /tmp/demo-shots/02-cases.png
      - name: Replace website Cases image
        run: |
          cp /tmp/demo-shots/02-cases.png public/product-screenshots/cases.png
          python - <<'PY'
          from pathlib import Path
          p=Path("app/page.tsx")
          s=p.read_text()
          s=s.replace('src="/product-screenshots/cases.webp"', 'src="/product-screenshots/cases.png"')
          s=s.replace('alt="Auctrail surplus property cases and workflow" width={1440} height={960}', 'alt="Auctrail surplus property cases and workflow" width={1440} height={900}')
          p.write_text(s)
          PY
      - name: Commit fresh screenshot
        run: |
          git config user.name "Auctrail Website Automation"
          git config user.email "brianensey@users.noreply.github.com"
          git add public/product-screenshots/cases.png app/page.tsx
          git commit -m "Replace blurry Cases image with fresh Demo screenshot"
          git push origin HEAD:main
